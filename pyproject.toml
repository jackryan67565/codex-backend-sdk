[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-backend-sdk"
version = "0.4.0"
description = "Agent-safe Python client for the ChatGPT Codex Responses backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["openai", "codex", "chatgpt", "llm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
markers = [
    "live: uses stored credentials, OpenAI network access, and account quota",
]

[tool.hatch.build.targets.wheel]
packages = ["codex_backend_sdk"]
